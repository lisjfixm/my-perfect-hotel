	<script>
/* Debug panel: status + event-injection auto-play + Unity SendMessage 橋接作弊.
 * 經由 unityGame.SendMessage(GameObject, 方法, 參數) 呼叫成品內部方法：
 *  - Hotel.UnlockAll：解鎖全部房間/人員（已驗證）
 *  - heap 回溯 GameSession→GameData→Wallet 字典，直寫軟幣餘額（f32），再 ForceSetValue 同步 HUD。
 * 星星無 SendMessage 直設入口，尚需 heap 寫入 HotelData.StartsCount。 */
(function () {
	"use strict";

	var state = {
		ready: false,
		auto: false,
		mode: "random",       // random | patrol | center
		interval: 1600,
		timer: null,
		patrol: null,
		events: 0,
		logs: []
	};

	function $(id) { return document.getElementById(id); }

	function log(msg) {
		state.logs.unshift(msg);
		if (state.logs.length > 40) state.logs.pop();
		var el = $("dbg-log");
		if (el) el.innerHTML = state.logs.map(function (l) {
			return "<div>" + l.replace(/[<>&]/g, function (c) {
				return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
			}) + "</div>";
		}).join("");
	}

	function canvas() { return document.getElementById("game"); }

	function rectOf() {
		var c = canvas();
		if (!c) return null;
		var r = c.getBoundingClientRect();
		if (r.width === 0 || r.height === 0) return null;
		return r;
	}

	function pointFromNorm(nx, ny) {
		var r = rectOf();
		if (!r) return { x: window.innerWidth / 2, y: window.innerHeight / 2 };
		return { x: r.left + nx * r.width, y: r.top + ny * r.height };
	}

	function dispatchPointer(type, x, y, opts) {
		var c = canvas();
		if (!c) return;
		opts = opts || {};
		var r = c.getBoundingClientRect();
		var cx = x - r.left, cy = y - r.top;
		var evInit = {
			clientX: x, clientY: y, pageX: x, pageY: y,
			screenX: x, screenY: y,
			offsetX: cx, offsetY: cy,
			button: 0, buttons: type === "pointerup" || type === "mouseup" ? 0 : 1,
			pointerId: 1, pointerType: "touch", isPrimary: true,
			bubbles: true, cancelable: true, view: window
		};
		var pe = new PointerEvent(type, evInit);
		c.dispatchEvent(pe);

		// 同時補 mouse 事件（部分 Unity 輸入路徑走 mouse）
		var mType = type === "pointerdown" ? "mousedown" : type === "pointerup" ? "mouseup" : "mousemove";
		c.dispatchEvent(new MouseEvent(mType, evInit));

		// 觸控事件：Unity 讀 changedTouches
		var tType = type === "pointerdown" ? "touchstart" : type === "pointerup" ? "touchend" : "touchmove";
		var touch = new Touch({
			identifier: 1, target: c,
			clientX: x, clientY: y, pageX: x, pageY: y,
			screenX: x, screenY: y, radiusX: 1, radiusY: 1, force: 1
		});
		c.dispatchEvent(new TouchEvent(tType, {
			bubbles: true, cancelable: true, view: window,
			touches: type === "pointerup" || type === "pointerup" ? [] : [touch],
			targetTouches: type === "pointerup" ? [] : [touch],
			changedTouches: [touch]
		}));
		state.events++;
	}

	function tapAt(nx, ny) {
		var p = pointFromNorm(nx, ny);
		dispatchPointer("pointerdown", p.x, p.y);
		setTimeout(function () { dispatchPointer("pointerup", p.x, p.y); }, 60);
	}

	function dragTo(nx, ny) {
		var p = pointFromNorm(nx, ny);
		dispatchPointer("pointerdown", p.x, p.y);
		var steps = 5;
		for (var i = 1; i <= steps; i++) {
			(function (k) {
				setTimeout(function () {
					dispatchPointer("pointermove", p.x, p.y);
				}, k * 40);
			})(i);
		}
		setTimeout(function () { dispatchPointer("pointerup", p.x, p.y); }, steps * 40 + 60);
	}

	function randomPoint() {
		// 避開頂部 HUD 與底部太邊緣，落在場景主體
		return { nx: 0.15 + Math.random() * 0.7, ny: 0.25 + Math.random() * 0.6 };
	}

	function patrolPoint() {
		if (!state.patrol) {
			state.patrol = { i: 0, pts: [
				{ nx: 0.5, ny: 0.5 }, { nx: 0.3, ny: 0.4 }, { nx: 0.7, ny: 0.4 },
				{ nx: 0.4, ny: 0.7 }, { nx: 0.6, ny: 0.7 }
			]};
		}
		var pt = state.patrol.pts[state.patrol.i % state.patrol.pts.length];
		state.patrol.i++;
		return pt;
	}

	function step() {
		if (!state.ready) return;
		var pt;
		if (state.mode === "center") pt = { nx: 0.5, ny: 0.5 };
		else if (state.mode === "patrol") pt = patrolPoint();
		else pt = randomPoint();

		if (state.mode === "patrol") dragTo(pt.nx, pt.ny);
		else tapAt(pt.nx, pt.ny);

		log("自動操作 #" + state.events + " → (" + pt.nx.toFixed(2) + ", " + pt.ny.toFixed(2) + ") [" + state.mode + "]");
		refreshStatus();
	}

	function startAuto() {
		if (state.auto) return;
		if (!state.ready) { log("遊戲尚未載入完成，無法開始"); return; }
		state.auto = true;
		state.timer = setInterval(step, state.interval);
		log("自動游玩已開啟（" + state.mode + "，間隔 " + state.interval + "ms）");
		refreshStatus();
	}

	function stopAuto() {
		state.auto = false;
		if (state.timer) { clearInterval(state.timer); state.timer = null; }
		log("自動游玩已停止");
		refreshStatus();
	}

	function refreshStatus() {
		var el = $("dbg-status");
		if (!el) return;
		var g = window.unityGame;
		var bridge = window.pokiBridge || "(尚未建立)";
		var cfg = window.config || {};
		el.innerHTML =
			"<div>載入狀態：" + (state.ready ? "已就緒" : "載入中") + "</div>" +
			"<div>版本：" + ((cfg.metadata && cfg.metadata.product_version) || "—") + "</div>" +
			"<div>產品：" + ((cfg.metadata && cfg.metadata.product_name) || "—") + "</div>" +
			"<div>語言 stub：" + (typeof PokiSDK !== "undefined" ? PokiSDK.getLanguage() : "—") + "</div>" +
			"<div>橋接物件：" + bridge + "</div>" +
			"<div>注入事件：" + state.events + "</div>" +
			"<div>自動游玩：" + (state.auto ? "開啟" : "關閉") + "</div>";
	}

	function pollReady() {
		var g = window.unityGame;
		if (g && !state.ready) {
			state.ready = true;
			log("Unity 實例就緒，可操作");
			refreshStatus();
		}
		if (!state.ready) refreshStatus();
	}

	function init() {
		var panel = document.createElement("div");
		panel.id = "dbg-panel";
		panel.innerHTML =
			"<h2>Debug 菜單</h2>" +
			"<div class=\"dbg-row\"><label>自動游玩模式</label>" +
			"<select id=\"dbg-mode\">" +
			"<option value=\"random\">隨機點擊</option>" +
			"<option value=\"patrol\">拖曳巡邏</option>" +
			"<option value=\"center\">重複點中央</option>" +
			"</select></div>" +
			"<div class=\"dbg-row\"><label>操作間隔 (ms)</label>" +
			"<select id=\"dbg-interval\">" +
			"<option value=\"1200\">1200</option>" +
			"<option value=\"1600\" selected>1600</option>" +
			"<option value=\"2400\">2400</option>" +
			"</select></div>" +
			"<div class=\"dbg-row\">" +
			"<button id=\"dbg-start\" class=\"primary\">開始自動</button>" +
			"<button id=\"dbg-stop\">停止</button>" +
			"<button id=\"dbg-tap\">點中央</button>" +
			"</div>" +
			"<div class=\"dbg-row dbg-cheat-title\"><label>作弊（Unity SendMessage 橋接）</label></div>" +
			"<div class=\"dbg-row\">" +
			"<button id=\"dbg-coin\">加金幣</button>" +
			"<button id=\"dbg-star\">加星星</button>" +
			"<button id=\"dbg-unlock\">全解鎖</button>" +
			"</div>" +
			"<div id=\"dbg-status\"></div>" +
			"<div id=\"dbg-log\"></div>" +
			"<p class=\"dbg-hint\">加金幣直寫真 wallet 並同步 HUD；全解鎖為內部 UnlockAll。星星暫無入口，需記憶體寫入。</p>";
		document.body.appendChild(panel);

		var toggle = document.createElement("button");
		toggle.id = "dbg-toggle";
		toggle.textContent = "D";
		toggle.title = "Debug 菜單";
		document.body.appendChild(toggle);

		toggle.addEventListener("click", function () {
			panel.classList.toggle("open");
		});
		$("dbg-mode").addEventListener("change", function (e) {
			state.mode = e.target.value;
			log("模式切換：" + state.mode);
		});
		$("dbg-interval").addEventListener("change", function (e) {
			state.interval = parseInt(e.target.value, 10) || 1600;
			if (state.auto) { stopAuto(); startAuto(); }
		});
		$("dbg-start").addEventListener("click", startAuto);
		$("dbg-stop").addEventListener("click", stopAuto);
		$("dbg-tap").addEventListener("click", function () {
			if (!state.ready) { log("遊戲尚未載入完成"); return; }
			tapAt(0.5, 0.5);
			log("手動點擊中央");
			refreshStatus();
		});

		// Unity SendMessage 橋接：第三參省略走無參變體；number 走 SendMessageFloat；string 走 SendMessageString
		function cheatSend(go, method, param) {
			var g = window.unityGame;
			if (!g || typeof g.SendMessage !== "function") { log("Unity 實例尚未就緒"); return false; }
			try {
				if (param === undefined) g.SendMessage(go, method);
				else g.SendMessage(go, method, param);
				return true;
			} catch (e) {
				log("SendMessage 失敗：" + (e && e.message ? e.message : e));
				return false;
			}
		}

		// 執行期 heap 回溯：GameSession → GameData(+20) → Wallet(+92) → Dictionary(+8) → Entry[]；
		// 回傳軟幣（key=0）餘額欄位位址，找不到回傳 -1。欄位偏移依本成品 build 固定。
		function locateCoinSlot(M) {
			try {
				var H = M.HEAPU32, B = M.HEAPU8;
				function u32(a) { return H[a / 4] >>> 0; }
				function cstr(a) {
					if (!a || a < 100) return null;
					var e = a; while (e < B.length && B[e] !== 0) e++;
					if (e - a > 48) return null;
					return String.fromCharCode.apply(null, Array.from(B.subarray(a, e)));
				}
				function klassName(k) { if (!k || k < 1000) return null; return cstr(u32(k + 8)); }
				function findStr(s) {
					var t = [].map.call(s, function (ch) { return ch.charCodeAt(0); });
					for (var i = 0; i <= B.length - t.length; i++) {
						var ok = true;
						for (var k = 0; k < t.length; k++) { if (B[i + k] !== t[k]) { ok = false; break; } }
						if (ok && (i === 0 || B[i - 1] === 0) && B[i + t.length] === 0) return i;
					}
					return -1;
				}
				function klassByName(n) {
					var S = findStr(n); if (S < 0) return null;
					for (var i = 0; i < H.length; i++) {
						if (H[i] === S) {
							var base = i * 4 - 8;
							if (u32(base + 32) === base && u32(base + 36) === base) return base;
						}
					}
					return null;
				}
				function instances(k) {
					var o = [];
					for (var i = 0; i < H.length; i++) {
						if (H[i] === k) { var x = i * 4; if (u32(x + 4) === 0) o.push(x); }
					}
					return o;
				}
				var kGS = klassByName("GameSession"); if (!kGS) return -1;
				var gs = instances(kGS).find(function (o) { return klassName(u32(u32(o + 20))) === "GameData"; });
				if (!gs) return -1;
				var gd = u32(gs + 20), wallet = u32(gd + 92), dic = u32(wallet + 8);
				var ent = u32(dic + 12), elen = u32(ent + 12);
				for (var k = 0; k < elen; k++) {
					var b = ent + 16 + k * 16;
					if (u32(b + 8) === 0) return b + 12;
				}
				return -1;
			} catch (e) { return -1; }
		}

		$("dbg-unlock").addEventListener("click", function () {
			if (!state.ready) { log("遊戲尚未載入完成"); return; }
			if (cheatSend("Hotel", "UnlockAll")) log("已呼叫 Hotel.UnlockAll（解鎖全部）");
			refreshStatus();
		});

		$("dbg-coin").addEventListener("click", function () {
			if (!state.ready) { log("遊戲尚未載入完成"); return; }
			var raw = prompt("設定金幣數值：", "100000");
			if (raw === null) { log("已取消"); return; }
			var v = parseInt(raw, 10);
			if (isNaN(v)) { log("輸入不是有效數字"); return; }
			var wrote = false;
			var M = window.unityGame && window.unityGame.Module;
			if (M) {
				var slot = locateCoinSlot(M);
				if (slot >= 0) { M.HEAPF32[slot / 4] = v; wrote = true; }
			}
			cheatSend("MoneyCounter", "ForceSetValue", v);
			log((wrote ? "真 wallet 已寫入" : "真 wallet 定位失敗，僅同步 HUD") + "：金幣 = " + v);
			refreshStatus();
		});

		$("dbg-star").addEventListener("click", function () {
			log("加星星：尚無 SendMessage 入口，需 heap 寫入 HotelData.StartsCount 後刷新 StarsBar。");
		});

		// 輪詢 Unity 實例就緒狀態，更新面板
		setInterval(pollReady, 500);
		refreshStatus();
	}

	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", init);
	} else {
		init();
	}
})();
	</script>
